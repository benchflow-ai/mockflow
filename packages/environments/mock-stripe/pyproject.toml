[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mock-stripe"
version = "0.1.0"
description = "Mock Stripe API environment for AI agent safety evaluation and RL training"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "faker>=22.0",
    "click>=8.0",
    "httpx>=0.27.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
mcp = ["fastapi-mcp>=0.1.0"]
gym = ["gymnasium>=0.29.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-json-report>=1.5", "ruff>=0.3.0",
       "pyjwt>=2.8", "cryptography>=43.0"]
all = ["mock-stripe[mcp,gym,dev]"]

# Default group so `uv run pytest tests/ -q` works cold. auth-client is
# deliberately NOT a path dependency here: a [tool.uv.sources] relative path
# breaks `uv pip install -e .` from shallow copies like the /app used by task
# Dockerfiles. tests/conftest.py adds the sibling package to sys.path instead;
# pyjwt/cryptography below are its import-time dependencies (auth tests only).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-json-report>=1.5",
    "pyjwt>=2.8",
    "cryptography>=43.0",
]

[project.scripts]
mock-stripe = "mock_stripe.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["mock_stripe*"]

[tool.setuptools.package-data]
mock_stripe = ["web/templates/*.html"]
