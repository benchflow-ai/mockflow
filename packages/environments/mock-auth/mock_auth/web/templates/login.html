{% extends "base.html" %}
{% block title %}Sign in — auth{% endblock %}
{% block content %}
  <h1>Sign in</h1>
  <div class="subtitle">Use your auth account</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/web/login">
    <input type="email" name="email" placeholder="Email" value="{{ prefill_email }}" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="actions">
      <button type="submit" class="primary">Next</button>
    </div>
  </form>
{% endblock %}
