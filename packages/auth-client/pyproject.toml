[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auth-client"
version = "0.1.0"
description = "Middleware for env_0_* resource servers to validate auth JWTs (RS256/JWKS) and enforce scopes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "starlette>=0.36",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["env_0_auth_client*"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
